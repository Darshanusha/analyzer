spring:
  application:
    name: analyzer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/analyzer}
    username: ${DATABASE_USERNAME:analyzer}
    password: ${DATABASE_PASSWORD:analyzer-local}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:1000}
      validation-timeout: 2000
  flyway:
    enabled: true
    default-schema: analyzer
    schemas: analyzer
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: analyzer
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  ai:
    model:
      chat: ${OPENAI_CHAT_PROVIDER:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: ${OPENAI_TIMEOUT:200s}
      max-retries: ${OPENAI_MAX_RETRIES:2}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-6.1-sol}
          #temperature: 0.1
          store: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:always}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        stock.analysis.ai.response.duration: true
        stock.analysis.ai.tool.duration: true
        stock.analysis.llm.forecast.duration: true
        stock.analysis.llm.selection.duration: true
        stock.analysis.llm.selection.response.duration: true
        stock.analysis.llm.selection.tool.duration: true
        stock.analysis.llm.selection.web.research.duration: true
        stock.analysis.agent.turn.duration: true
        stock.analysis.agent.response.duration: true
        stock.analysis.agent.tool.duration: true
        stock.analysis.agent.summary.duration: true
        stock.analysis.step.duration: true
        stock.analysis.external.request.duration: true
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: stock-analysis
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.stock.analyzer: ${APP_LOG_LEVEL:INFO}

info:
  application:
    name: ${spring.application.name}
    description: Explainable AI-assisted stock market analyzer

providers:
  sharadar:
    base-url: ${SHARADAR_BASE_URL:https://api.sharadar.com/v1.0}
    api-key: ${SHARADAR_API_KEY:}
  benzinga:
    base-url: ${BENZINGA_BASE_URL:https://api.benzinga.com}
    api-key: ${BENZINGA_API_KEY:}

analysis:
  history-years: ${ANALYSIS_HISTORY_YEARS:10}
  news-lookback-days: ${ANALYSIS_NEWS_LOOKBACK_DAYS:30}
  default-wait-seconds: ${ANALYSIS_DEFAULT_WAIT_SECONDS:60}
  max-wait-seconds: ${ANALYSIS_MAX_WAIT_SECONDS:120}
  concurrency:
    batch-max-concurrent-items: ${BATCH_ANALYSIS_MAX_CONCURRENCY:4}
    batch-queue-capacity: ${BATCH_ANALYSIS_QUEUE_CAPACITY:600}
    open-ai-max-concurrent-requests: ${OPENAI_MAX_CONCURRENT_REQUESTS:4}
    selection-web-research-max-concurrent-requests: ${LLM_SELECTION_WEB_RESEARCH_MAX_CONCURRENCY:4}
    sharadar-max-concurrent-requests: ${SHARADAR_MAX_CONCURRENT_REQUESTS:2}
    permit-timeout: ${EXTERNAL_REQUEST_PERMIT_TIMEOUT:5m}
    transient-max-retries: ${EXTERNAL_REQUEST_MAX_RETRIES:2}
    initial-retry-delay: ${EXTERNAL_REQUEST_INITIAL_RETRY_DELAY:1s}
    maximum-retry-delay: ${EXTERNAL_REQUEST_MAX_RETRY_DELAY:30s}
  touch-target:
    upside-percent: ${STOCK_TARGET_UPSIDE_PERCENT:3.0}
    downside-percent: ${STOCK_TARGET_DOWNSIDE_PERCENT:2.0}
  llm-forecast:
    enabled: ${LLM_FORECAST_ENABLED:false}
    prompt-version: ${LLM_FORECAST_PROMPT_VERSION:llm-five-session-v6}
    up-threshold: ${LLM_FORECAST_UP_THRESHOLD:55}
    down-threshold: ${LLM_FORECAST_DOWN_THRESHOLD:45}
    recent-news-tool-enabled: ${LLM_RECENT_NEWS_TOOL_ENABLED:false}
    max-database-tool-calls: ${LLM_MAX_DATABASE_TOOL_CALLS:5}
    candidate-filter:
      probability-threshold: ${LLM_FILTER_PROBABILITY_THRESHOLD:0.50}
      minimum-positive-signals: ${LLM_FILTER_MINIMUM_POSITIVE_SIGNALS:3}
      minimum-technical-signals: ${LLM_FILTER_MINIMUM_TECHNICAL_SIGNALS:1}
    web-research:
      enabled: ${LLM_WEB_RESEARCH_ENABLED:false}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_WEB_SEARCH_MODEL:gpt-6-luna}
      reasoning-effort: ${LLM_WEB_RESEARCH_REASONING_EFFORT:low}
      connect-timeout: ${LLM_WEB_RESEARCH_CONNECT_TIMEOUT:10s}
      read-timeout: ${LLM_WEB_RESEARCH_READ_TIMEOUT:180s}
      max-requests-per-forecast: ${LLM_WEB_RESEARCH_MAX_REQUESTS:5}
      max-summary-characters: ${LLM_WEB_RESEARCH_MAX_SUMMARY_CHARACTERS:6000}
      allowed-domains: ${LLM_WEB_RESEARCH_ALLOWED_DOMAINS:sec.gov,data.sec.gov,federalreserve.gov,bls.gov,bea.gov}
      searchable-categories: ${LLM_WEB_RESEARCH_CATEGORIES:NEWS,REGULATORY,COMPANY_EVENT,EARNINGS,MACRO}
  llm-selection:
    enabled: ${LLM_SELECTION_ENABLED:false}
    model: ${LLM_SELECTION_MODEL:gpt-6.1-sol}
    reasoning-effort: ${LLM_SELECTION_REASONING_EFFORT:medium}
    prompt-version: ${LLM_SELECTION_PROMPT_VERSION:llm-top-candidate-selection-v3}
    candidate-limit: ${LLM_SELECTION_CANDIDATE_LIMIT:15}
    selection-limit: ${LLM_SELECTION_RESULT_LIMIT:3}
    max-database-tool-calls: ${LLM_SELECTION_MAX_DATABASE_TOOL_CALLS:12}
    max-rounds: ${LLM_SELECTION_MAX_ROUNDS:14}
    web-research-enabled: ${LLM_SELECTION_WEB_RESEARCH_ENABLED:true}
    web-research-required: ${LLM_SELECTION_WEB_RESEARCH_REQUIRED:true}
    web-research-max-requests: ${LLM_SELECTION_WEB_RESEARCH_MAX_REQUESTS:15}
    web-research-model: ${LLM_SELECTION_WEB_RESEARCH_MODEL:gpt-6-luna}
    web-research-reasoning-effort: ${LLM_SELECTION_WEB_RESEARCH_REASONING_EFFORT:low}
    web-research-allowed-domains: ${LLM_SELECTION_WEB_RESEARCH_ALLOWED_DOMAINS:sec.gov,data.sec.gov,reuters.com,apnews.com,nasdaq.com,nyse.com,federalreserve.gov,bls.gov,bea.gov}
    web-research-max-summary-characters: ${LLM_SELECTION_WEB_RESEARCH_MAX_SUMMARY_CHARACTERS:4000}
    default-wait-seconds: ${LLM_SELECTION_DEFAULT_WAIT_SECONDS:60}
    max-wait-seconds: ${LLM_SELECTION_MAX_WAIT_SECONDS:120}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    connect-timeout: ${LLM_SELECTION_CONNECT_TIMEOUT:10s}
    read-timeout: ${LLM_SELECTION_READ_TIMEOUT:180s}
  research-agent:
    enabled: ${RESEARCH_AGENT_ENABLED:false}
    model: ${RESEARCH_AGENT_MODEL:gpt-6.1-sol}
    reasoning-effort: ${RESEARCH_AGENT_REASONING_EFFORT:medium}
    summary-model: ${RESEARCH_AGENT_SUMMARY_MODEL:gpt-6.1-sol}
    summary-reasoning-effort: ${RESEARCH_AGENT_SUMMARY_REASONING_EFFORT:low}
    summary-threshold-messages: ${RESEARCH_AGENT_SUMMARY_THRESHOLD_MESSAGES:20}
    max-tool-calls: ${RESEARCH_AGENT_MAX_TOOL_CALLS:12}
    max-rounds: ${RESEARCH_AGENT_MAX_ROUNDS:14}
    max-message-characters: ${RESEARCH_AGENT_MAX_MESSAGE_CHARACTERS:8000}
    max-response-tokens: ${RESEARCH_AGENT_MAX_RESPONSE_TOKENS:4000}
    max-summary-tokens: ${RESEARCH_AGENT_MAX_SUMMARY_TOKENS:1600}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    connect-timeout: ${RESEARCH_AGENT_CONNECT_TIMEOUT:10s}
    read-timeout: ${RESEARCH_AGENT_READ_TIMEOUT:180s}

prediction:
  model-path: ${PREDICTION_MODEL_PATH:./model-artifacts/champion.json}
  decision-threshold: ${PREDICTION_DECISION_THRESHOLD:0.5}
